<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طيّار — تتبع الطلب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  --gold:#C9A84C;--gold-l:#E8C96A;--gold-dim:rgba(201,168,76,.15);
  --pend:#E8A24C;--onwy:#4C8FE8;--done:#4CAF7D;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;height:100vh;overflow:hidden;background:#f5f5f5}

/* ── MAP ── */
#map{position:absolute;inset:0;z-index:0}
.leaflet-control-attribution{display:none!important}
.leaflet-control-zoom{border:none!important;box-shadow:0 4px 20px rgba(0,0,0,.15)!important;margin:76px 14px!important}
.leaflet-control-zoom a{background:#fff!important;color:#333!important;border:none!important;
  font-size:17px!important;width:38px!important;height:38px!important;line-height:38px!important;border-radius:10px!important;box-shadow:0 2px 8px rgba(0,0,0,.1)!important}

/* ── DRIVER MARKER ── */
@keyframes driverPing{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.8);opacity:0}}
.driver-wrap{position:relative;width:54px;height:54px}
.driver-ping{position:absolute;inset:0;border-radius:50%;background:rgba(76,143,232,.4);animation:driverPing 2s ease-out infinite}
.driver-core{position:absolute;inset:7px;border-radius:50%;background:linear-gradient(135deg,#2563EB,#60A5FA);
  border:3px solid #fff;box-shadow:0 4px 18px rgba(37,99,235,.5);display:flex;align-items:center;justify-content:center}
.driver-core img{width:100%;height:100%;border-radius:50%;object-fit:cover}

/* ── CUSTOMER PIN ── */
.cust-wrap{position:relative;width:38px;height:46px}
.cust-pin{width:38px;height:38px;background:#fff;border-radius:50% 50% 50% 4px;
  transform:rotate(-45deg);border:3px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center}
.cust-pin span{transform:rotate(45deg);font-size:16px}

/* ── TOP BAR ── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;
  padding:12px 16px;background:linear-gradient(180deg,rgba(255,255,255,.97) 75%,transparent);
  display:flex;align-items:center;justify-content:space-between}
.back-btn{background:#fff;border:1px solid #eee;color:#333;width:38px;height:38px;
  border-radius:12px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:.2s}
.back-btn:hover{box-shadow:0 4px 14px rgba(0,0,0,.15)}
.top-brand{font-size:17px;font-weight:900;color:var(--gold);letter-spacing:1px}
.order-chip{background:#f5f5f5;border:1px solid #e8e8e8;padding:5px 13px;
  border-radius:50px;font-size:12px;font-weight:700;color:#555}
.order-chip b{color:#111}

/* ── BOTTOM SHEET ── */
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;
  border-radius:28px 28px 0 0;box-shadow:0 -12px 50px rgba(0,0,0,.15);
  animation:sheetUp .45s cubic-bezier(.34,1.3,.64,1) both}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:38px;height:4px;background:#E0E0E0;border-radius:2px;margin:14px auto 0}

/* ── CAPTAIN CARD ── */
.captain-card{display:flex;align-items:center;gap:14px;padding:16px 20px 12px;border-bottom:1px solid #f0f0f0}
.captain-avatar{width:54px;height:54px;border-radius:16px;object-fit:cover;background:#f0f0f0;flex-shrink:0;border:2px solid #eee}
.captain-info{flex:1}
.c-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#aaa;font-weight:700;margin-bottom:2px}
.c-name{font-size:16px;font-weight:900;color:#111;line-height:1.2}
.c-rating{font-size:12px;color:#888;margin-top:2px}
.c-rating .star{color:var(--gold)}
.call-btn,.msg-btn{width:44px;height:44px;border-radius:14px;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  text-decoration:none;transition:transform .15s,box-shadow .2s;flex-shrink:0}
.call-btn{background:linear-gradient(135deg,#16A34A,#22C55E);box-shadow:0 4px 14px rgba(22,163,74,.3)}
.call-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.4)}
.msg-btn{background:linear-gradient(135deg,#2563EB,#60A5FA);box-shadow:0 4px 14px rgba(37,99,235,.25);margin-right:8px}
.msg-btn:hover{transform:translateY(-2px)}

/* ── ETA BAR ── */
.eta-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #f0f0f0}
.eta-left{display:flex;align-items:center;gap:10px}
.eta-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.eta-lbl{font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.5px}
.eta-val{font-size:17px;font-weight:900;color:#111;margin-top:1px}
.s-pill{padding:7px 16px;border-radius:50px;font-size:12px;font-weight:800}
.sp-pend{background:rgba(232,162,76,.12);color:var(--pend)}
.sp-onwy{background:rgba(76,143,232,.12);color:var(--onwy)}
.sp-done{background:rgba(76,175,125,.12);color:var(--done)}

/* ── STEPS ── */
.steps-wrap{padding:14px 20px 18px}
.steps{display:flex;align-items:flex-start}
.step{display:flex;flex-direction:column;align-items:center;flex:1}
.step-dot{width:30px;height:30px;border-radius:50%;background:#f5f5f5;border:2px solid #e0e0e0;
  display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .4s;position:relative;z-index:1}
.step-dot.active{border-color:var(--gold);background:rgba(201,168,76,.1);box-shadow:0 0 0 4px rgba(201,168,76,.12)}
.step-dot.done{background:rgba(76,175,125,.12);border-color:var(--done)}
.step-lbl{font-size:10px;color:#aaa;margin-top:5px;text-align:center;font-weight:700}
.step-line{flex:1;height:2px;background:#eee;margin-top:14px;transition:background .4s}
.step-line.done{background:var(--done)}
.step-line.active{background:linear-gradient(90deg,var(--done),var(--gold))}

/* ── ORDER TYPE TAG ── */
.order-type-tag{display:inline-flex;align-items:center;gap:5px;background:#f5f5f5;
  border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;color:#555;margin-right:6px}

/* ── LOADING ── */
.loading-ov{position:fixed;inset:0;z-index:99;background:#fff;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .5s,visibility .5s}
.loading-ov.gone{opacity:0;visibility:hidden}
.spin-ring{width:50px;height:50px;border:4px solid #f0f0f0;border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:14px;color:#aaa;font-weight:600}

/* ── CELEBRATION ── */
.celeb-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;
  transition:opacity .4s;backdrop-filter:blur(5px)}
.celeb-wrap.show{opacity:1;visibility:visible}
.celeb-box{background:#fff;border-radius:28px;padding:40px 32px;text-align:center;
  max-width:300px;width:90%;transform:scale(.85);transition:transform .4s cubic-bezier(.34,1.4,.64,1);
  box-shadow:0 24px 60px rgba(0,0,0,.25)}
.celeb-wrap.show .celeb-box{transform:scale(1)}
.celeb-emoji{font-size:58px;margin-bottom:12px}
.celeb-title{font-size:22px;font-weight:900;color:#111;margin-bottom:6px}
.celeb-sub{font-size:14px;color:#888}
.celeb-close{margin-top:22px;padding:13px 30px;background:linear-gradient(135deg,var(--gold),var(--gold-l));
  border:none;border-radius:14px;font-family:'Cairo',sans-serif;font-size:15px;font-weight:900;
  color:#0A0A0A;cursor:pointer;width:100%}

/* ── TOAST ── */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:#111;color:#fff;padding:11px 22px;border-radius:50px;font-size:13px;font-weight:700;
  z-index:99;box-shadow:0 8px 28px rgba(0,0,0,.3);transition:transform .4s cubic-bezier(.34,1.4,.64,1);
  white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── NOT FOUND ── */
.not-found{position:fixed;inset:0;z-index:90;background:#fff;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px;text-align:center}
.not-found.gone{display:none}
.nf-icon{font-size:52px}
.nf-title{font-size:20px;font-weight:900;color:#111}
.nf-sub{font-size:13px;color:#888}
.nf-btn{margin-top:14px;padding:12px 28px;background:linear-gradient(135deg,var(--gold),var(--gold-l));
  border:none;border-radius:12px;font-family:'Cairo',sans-serif;font-size:15px;font-weight:900;
  color:#0A0A0A;cursor:pointer}
</style>
</head>
<body>

<!-- Loading -->
<div class="loading-ov" id="loadingOv">
  <div class="spin-ring"></div>
  <div class="loading-txt">جاري تحميل طلبك...</div>
</div>

<!-- Not Found -->
<div class="not-found gone" id="notFound">
  <div class="nf-icon">🔍</div>
  <div class="nf-title">الطلب غير موجود</div>
  <div class="nf-sub" id="nfSub">لم يُعثر على طلب بهذا الرقم</div>
  <button class="nf-btn" onclick="location.href='Index.html'">← الرجوع للرئيسية</button>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Top bar -->
<div class="topbar">
  <a href="Index.html" class="back-btn">←</a>
  <span class="top-brand">🛵 طيّار</span>
  <div class="order-chip">طلب #<b id="orderNum">—</b></div>
</div>

<!-- Bottom Sheet -->
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>

  <!-- Captain -->
  <div class="captain-card" id="captainCard">
    <img class="captain-avatar" id="captainAvatar"
      src="https://api.dicebear.com/7.x/avataaars/svg?seed=capt&backgroundColor=b6e3f4" alt="">
    <div class="captain-info">
      <div class="c-label">الكابتن</div>
      <div class="c-name" id="captainName">جاري البحث عن كابتن...</div>
      <div class="c-rating" id="captainRating"><span class="star">★★★★★</span> —</div>
    </div>
    <a class="msg-btn" id="msgBtn" href="sms:" title="رسالة">💬</a>
    <a class="call-btn" id="callBtn" href="tel:" title="اتصال">📞</a>
  </div>

  <!-- ETA -->
  <div class="eta-bar">
    <div class="eta-left">
      <div class="eta-icon" id="etaIcon" style="background:rgba(232,162,76,.1)">⏳</div>
      <div>
        <div class="eta-lbl">الوقت المتوقع للوصول</div>
        <div class="eta-val" id="etaVal">—</div>
      </div>
    </div>
    <div class="s-pill sp-pend" id="statusPill">قيد الانتظار</div>
  </div>

  <!-- Steps -->
  <div class="steps-wrap">
    <div class="steps">
      <div class="step">
        <div class="step-dot active" id="dot1">📋</div>
        <div class="step-lbl">تم الطلب</div>
      </div>
      <div class="step-line" id="line1"></div>
      <div class="step">
        <div class="step-dot" id="dot2">🛵</div>
        <div class="step-lbl">في الطريق</div>
      </div>
      <div class="step-line" id="line2"></div>
      <div class="step">
        <div class="step-dot" id="dot3">✅</div>
        <div class="step-lbl">تم التسليم</div>
      </div>
    </div>
  </div>
</div>

<!-- Celebration -->
<div class="celeb-wrap" id="celebWrap">
  <div class="celeb-box">
    <div class="celeb-emoji">🎉</div>
    <div class="celeb-title">وصل طلبك!</div>
    <div class="celeb-sub">شكراً لاستخدامك طيّار<br>تجربة توصيل ممتازة 🛵</div>
    <button class="celeb-close" onclick="document.getElementById('celebWrap').classList.remove('show')">
      تمام، شكراً!
    </button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const SUPA_URL = 'https://ckxljrwcsjmdflxyxxoc.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNreGxqcndjc2ptZGZseHl4eG9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NzcwODYsImV4cCI6MjA5NTQ1MzA4Nn0.tMouJB-NI12ev-TX9AX41CQzOCLQ4wR3xh6I2GTqxe0';
const db = supabase.createClient(SUPA_URL, SUPA_KEY);

const params = new URLSearchParams(location.search);
const orderNumber = params.get('order');
if (orderNumber) document.getElementById('orderNum').textContent = orderNumber;

// ── MAP ──
const map = L.map('map', { zoomControl:true, attributionControl:false }).setView([30.05,31.23],14);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  { subdomains:'abcd', maxZoom:19 }).addTo(map);

// Icons
const driverIcon = L.divIcon({
  html:`<div class="driver-wrap"><div class="driver-ping"></div><div class="driver-core">
    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=capt&backgroundColor=b6e3f4"></div></div>`,
  className:'', iconSize:[54,54], iconAnchor:[27,27], popupAnchor:[0,-27]
});
const custIcon = L.divIcon({
  html:`<div class="cust-wrap"><div class="cust-pin"><span>🏠</span></div></div>`,
  className:'', iconSize:[38,46], iconAnchor:[19,44], popupAnchor:[0,-44]
});

let driverMarker=null, custMarker=null, prevStatus=null, celebShown=false;

function moveSmooth(marker, ll, steps=20) {
  const s = marker.getLatLng();
  const dLat=(ll[0]-s.lat)/steps, dLng=(ll[1]-s.lng)/steps;
  let i=0;
  const iv = setInterval(()=>{ i++; marker.setLatLng([s.lat+dLat*i,s.lng+dLng*i]); if(i>=steps)clearInterval(iv); },40);
}

function calcETA(dlat,dlng,clat,clng) {
  const R=6371,dLat=(clat-dlat)*Math.PI/180,dLon=(clng-dlng)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(dlat*Math.PI/180)*Math.cos(clat*Math.PI/180)*Math.sin(dLon/2)**2;
  const d=R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  const mins=Math.max(1,Math.round(d/0.45));
  return mins===1?'أقل من دقيقة':`${mins} دقيقة`;
}

function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}
function vibrate() { if(navigator.vibrate) navigator.vibrate([80,40,80]); }
function beep() {
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='sine';o.frequency.setValueAtTime(932,ctx.currentTime);
    g.gain.setValueAtTime(.2,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.55);
    o.start();o.stop(ctx.currentTime+.55);
  }catch(e){}
}

const statusCfg = {
  'Pending':    {pill:'sp-pend',pillTxt:'قيد الانتظار',etaIcon:'⏳',etaBg:'rgba(232,162,76,.1)',step:1,toast:null},
  'On The Way': {pill:'sp-onwy',pillTxt:'في الطريق',   etaIcon:'🛵',etaBg:'rgba(76,143,232,.1)', step:2,toast:'🛵 الكابتن في طريقه إليك!'},
  'Delivered':  {pill:'sp-done',pillTxt:'تم التسليم',  etaIcon:'✅',etaBg:'rgba(76,175,125,.1)', step:3,toast:null},
};
const CAPTAIN = { name:'أحمد محمد', phone:'01012345678', rating:'4.9', trips:312,
  avatar:'https://api.dicebear.com/7.x/avataaars/svg?seed=capt&backgroundColor=b6e3f4' };

function updateSteps(step) {
  [1,2,3].forEach(i=>{
    document.getElementById('dot'+i).className='step-dot'+(i<step?' done':i===step?' active':'');
  });
  [1,2].forEach(i=>{
    document.getElementById('line'+i).className='step-line'+(i<step?' done':i===step?' active':'');
  });
}

async function poll() {
  if(!orderNumber) return;
  const {data,error} = await db.from('orders').select('*').eq('order_number',orderNumber).single();

  // Not found
  if (error && error.code === 'PGRST116') {
    document.getElementById('loadingOv').classList.add('gone');
    document.getElementById('notFound').classList.remove('gone');
    document.getElementById('nfSub').textContent = 'لم يُعثر على طلب رقم ' + orderNumber;
    return;
  }
  if (error || !data) return;

  document.getElementById('loadingOv').classList.add('gone');

  const cfg = statusCfg[data.status] || statusCfg['Pending'];

  // Status change notification
  if (prevStatus && prevStatus !== data.status) { vibrate(); beep(); if(cfg.toast) toast(cfg.toast); }
  prevStatus = data.status;

  // Captain info
  if (data.status !== 'Pending') {
    document.getElementById('captainName').textContent = CAPTAIN.name;
    document.getElementById('captainRating').innerHTML = `<span class="star">★★★★★</span> ${CAPTAIN.rating} (${CAPTAIN.trips} رحلة)`;
    document.getElementById('captainAvatar').src = CAPTAIN.avatar;
    document.getElementById('callBtn').href = 'tel:'+CAPTAIN.phone;
    document.getElementById('msgBtn').href = 'sms:'+CAPTAIN.phone;
  }

  // Order type tag in sheet handle area (first time only)
  if (data.order_type && !document.getElementById('orderTypeTag')) {
    const tag=document.createElement('div');
    tag.id='orderTypeTag';
    tag.style='text-align:center;padding:6px 0 0;';
    tag.innerHTML=`<span class="order-type-tag">${data.order_type}</span>`;
    document.querySelector('.sheet-handle').insertAdjacentElement('afterend',tag);
  }

  // Pill + ETA
  const pill = document.getElementById('statusPill');
  pill.className = 's-pill ' + cfg.pill;
  pill.textContent = cfg.pillTxt;
  document.getElementById('etaIcon').textContent = cfg.etaIcon;
  document.getElementById('etaIcon').style.background = cfg.etaBg;
  const etaEl = document.getElementById('etaVal');
  if (data.status==='On The Way' && data.driver_lat && data.customer_lat) {
    etaEl.textContent = calcETA(data.driver_lat,data.driver_lng,data.customer_lat,data.customer_lng);
  } else if (data.status==='Delivered') {
    etaEl.textContent = 'وصل! 🎉';
  } else {
    etaEl.textContent = 'جاري البحث...';
  }

  updateSteps(cfg.step);

  // Customer marker
  if (data.customer_lat && !custMarker) {
    custMarker = L.marker([data.customer_lat,data.customer_lng],{icon:custIcon}).addTo(map).bindPopup('موقعك');
    map.setView([data.customer_lat,data.customer_lng],15);
  }

  // Driver marker
  if (data.driver_lat && data.status !== 'Delivered') {
    const ll=[data.driver_lat,data.driver_lng];
    if (driverMarker) { moveSmooth(driverMarker,ll); }
    else {
      driverMarker=L.marker(ll,{icon:driverIcon}).addTo(map).bindPopup(CAPTAIN.name);
    }
    if (data.status==='On The Way' && data.customer_lat) {
      map.fitBounds([[data.driver_lat,data.driver_lng],[data.customer_lat,data.customer_lng]],{padding:[90,90]});
    }
  }

  // Delivered
  if (data.status==='Delivered') {
    if (driverMarker) { map.removeLayer(driverMarker); driverMarker=null; }
    if (!celebShown) { celebShown=true; vibrate(); beep(); setTimeout(()=>document.getElementById('celebWrap').classList.add('show'),700); }
  }
}

if (!orderNumber) {
  document.getElementById('loadingOv').classList.add('gone');
  document.getElementById('notFound').classList.remove('gone');
  document.getElementById('nfSub').textContent = 'لم يتم تحديد رقم الطلب';
} else {
  poll();
  setInterval(poll,3000);
}
</script>
</body>
</html>
