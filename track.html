function moveSmooth(marker, ll, steps=20) {
  const s = marker.getLatLng();
  const dLat=(ll[0]-s.lat)/steps, dLng=(ll[1]-s.lng)/steps;
  let i=0;
  const iv = setInterval(()=>{ i++; marker.setLatLng([s.lat+dLat*i,s.lng+dLng*i]); if(i>=steps)clearInterval(iv); },40);
}

function calcETA(dlat,dlng,clat,clng) {
  const R=6371,dLat=(clat-dlat)*Math.PI/180,dLon=(clng-dlng)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(dlat*Math.PI/180)*Math.cos(clat*Math.PI/180)*Math.sin(dLon/2)**2;
  const d=R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  const mins=Math.max(1,Math.round(d/0.45));
  return mins===1?'أقل من دقيقة':`${mins} دقيقة`;
}

function beep() {
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='sine';o.frequency.setValueAtTime(932,ctx.currentTime);
    g.gain.setValueAtTime(.2,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.55);
    o.start();o.stop(ctx.currentTime+.55);
  }catch(e){}
}

  if(!orderNumber) return;
  const {data,error} = await db.from('orders').select('*').eq('order_number',orderNumber).single();

  // Not found
  if (error && error.code === 'PGRST116') {
    document.getElementById('loadingOv').classList.add('gone');
    document.getElementById('notFound').classList.remove('gone');
    document.getElementById('nfSub').textContent = 'لم يُعثر على طلب رقم ' + orderNumber;
    return;
  }
  if (error || !data) return;

  document.getElementById('loadingOv').classList.add('gone');
  _cachedOrder = data;

  const cfg = statusCfg[data.status] || statusCfg['Pending'];

  // Always show invoice button once order is loaded
  document.getElementById('invBtn').classList.add('inv-btn-visible');

  // Status change notification
  if (prevStatus && prevStatus !== data.status) { vibrate(); beep(); if(cfg.toast) toast(cfg.toast); }
  prevStatus = data.status;

  // Captain info
  if (data.status !== 'Pending') {
    document.getElementById('captainName').textContent = CAPTAIN.name;
    document.getElementById('captainRating').innerHTML = `<span class="star">★★★★★</span> ${CAPTAIN.rating} (${CAPTAIN.trips} رحلة)`;
    document.getElementById('captainAvatar').src = CAPTAIN.avatar;
    document.getElementById('callBtn').href = 'tel:'+CAPTAIN.phone;
    document.getElementById('msgBtn').href = 'sms:'+CAPTAIN.phone;
  }

  // Order type tag in sheet handle area (first time only)
  if (data.order_type && !document.getElementById('orderTypeTag')) {
    const tag=document.createElement('div');
    tag.id='orderTypeTag';
    tag.style='text-align:center;padding:6px 0 0;';
    tag.innerHTML=`<span class="order-type-tag">${data.order_type}</span>`;
    document.querySelector('.sheet-handle').insertAdjacentElement('afterend',tag);
  }

  // Pill + ETA
  const pill = document.getElementById('statusPill');
  pill.className = 's-pill ' + cfg.pill;
  pill.textContent = cfg.pillTxt;
  document.getElementById('etaIcon').textContent = cfg.etaIcon;
  document.getElementById('etaIcon').style.background = cfg.etaBg;
  const etaEl = document.getElementById('etaVal');
  if (data.status==='On The Way' && data.driver_lat && data.customer_lat) {
    etaEl.textContent = calcETA(data.driver_lat,data.driver_lng,data.customer_lat,data.customer_lng);
  } else if (data.status==='Delivered') {
    etaEl.textContent = 'وصل! 🎉';
  } else {
    etaEl.textContent = 'جاري البحث...';
  }

  updateSteps(cfg.step);

  // Customer marker
  if (data.customer_lat && !custMarker) {
    custMarker = L.marker([data.customer_lat,data.customer_lng],{icon:custIcon}).addTo(map).bindPopup('موقعك');
    map.setView([data.customer_lat,data.customer_lng],15);
  }

  // Driver marker
  if (data.driver_lat && data.status !== 'Delivered') {
    const ll=[data.driver_lat,data.driver_lng];
    if (driverMarker) { moveSmooth(driverMarker,ll); }
    else {
      driverMarker=L.marker(ll,{icon:driverIcon}).addTo(map).bindPopup(CAPTAIN.name);
    }
    if (data.status==='On The Way' && data.customer_lat) {
      map.fitBounds([[data.driver_lat,data.driver_lng],[data.customer_lat,data.customer_lng]],{padding:[90,90]});
    }
  }

  // Delivered
  if (data.status==='Delivered') {
    if (driverMarker) { map.removeLayer(driverMarker); driverMarker=null; }
    if (!celebShown) {
      celebShown=true; vibrate(); beep();
      setTimeout(()=>document.getElementById('celebWrap').classList.add('show'),700);
    }
  }

  // Show restaurant names in chip (first time only)
  if (!document.getElementById('restLabel')) {
    let items = [];
    try { items = data.items ? JSON.parse(data.items) : []; } catch(e) {}
    const rests = [...new Set(items.map(i => i.restName).filter(Boolean))];
    const displayRest = rests.length > 0 ? rests.join(' • ') : data.restaurant;
    if (displayRest) {
      const chip = document.getElementById('orderChip');
      if (chip) {
        const restSpan = document.createElement('div');
        restSpan.id = 'restLabel';
        restSpan.style.cssText = 'font-size:10px;color:#FF6B35;font-weight:800;text-align:center;margin-top:2px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
        restSpan.textContent = displayRest;
        chip.appendChild(restSpan);
      }
    }
  }
}

/* ══════════════════════════════════════
   INVOICE
══════════════════════════════════════ */
function openInvoice() {
  const order = _cachedOrder;
  if (!order) return;

  let items = [];
  try { items = order.items ? JSON.parse(order.items) : []; } catch(e) {}
  const sub      = items.reduce((s,it) => s + it.price * it.qty, 0);
  const delivery = order.total && sub ? order.total - sub : 15;
  const grand    = order.total || sub + delivery;
  const trackUrl = `${location.origin}${location.pathname}?order=${order.order_number}`;
  const dateStr  = new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});

  // Generate QR
  const tmp = document.createElement('div');
  tmp.style.cssText = 'position:absolute;opacity:0;width:64px;height:64px';
  document.body.appendChild(tmp);
  new QRCode(tmp, { text: trackUrl, width: 64, height: 64, correctLevel: QRCode.CorrectLevel.M });

  setTimeout(() => {
    const canvas = tmp.querySelector('canvas');
    const qrSrc  = canvas ? canvas.toDataURL() : '';
    document.body.removeChild(tmp);

    // Group items by restaurant
    const groups = {};
    items.forEach(it => {
      const k = it.restName || order.restaurant || 'الطلب';
      if (!groups[k]) groups[k] = [];
      groups[k].push(it);
    });
    const restNames = Object.keys(groups);
    const multiRest = restNames.length > 1;

    // Status label
    const statusLabels = { Pending:'⏳ قيد الانتظار', 'On The Way':'🛵 في الطريق', Delivered:'✅ تم التسليم' };

    document.getElementById('invBody').innerHTML = `
      <div class="inv-head">
        <div>
          <div class="inv-logo">🛵 طيّار<small>توصيل سريع • في أي مكان</small></div>
        </div>
        ${qrSrc ? `<div class="inv-qr-wrap"><img src="${qrSrc}" width="64" height="64"></div>` : ''}
      </div>

      <div class="inv-sep"></div>
      <div class="inv-kv"><span>رقم الطلب</span><b>#${order.order_number}</b></div>
      <div class="inv-kv"><span>التاريخ</span><b>${dateStr}</b></div>
      <div class="inv-kv"><span>الحالة</span><b>${statusLabels[order.status] || order.status}</b></div>
      <div class="inv-sep"></div>
      <div class="inv-kv"><span>العميل</span><b>${order.customer_name}</b></div>
      <div class="inv-kv"><span>الهاتف</span><b>${order.phone}</b></div>
      <div class="inv-kv"><span>${multiRest ? 'المطاعم' : 'المطعم'}</span><b>${restNames.join(' • ')}</b></div>
      ${order.order_type ? `<div class="inv-kv"><span>نوع التوصيل</span><b>${order.order_type}</b></div>` : ''}

      ${items.length > 0 ? `
        <div class="inv-items-hd">الوجبات المطلوبة</div>
        ${restNames.map(rn => `
          ${multiRest ? `<div style="font-size:11px;font-weight:800;color:#FF6B35;padding:6px 0 4px;border-top:1px dashed #f0f0f0;margin-top:4px">🍽️ ${rn}</div>` : ''}
          ${groups[rn].map(it=>`
            <div class="inv-it">
              <span class="inv-it-name">${it.name}</span>
              <span class="inv-it-qty">× ${it.qty}</span>
              <span class="inv-it-price">${it.price * it.qty} ج</span>
            </div>`).join('')}
        `).join('')}
      ` : ''}

      <div class="inv-totbox">
        ${sub > 0 ? `
          <div class="inv-tot-r"><span>مجموع الوجبات</span><span>${sub} ج</span></div>
          <div class="inv-tot-r"><span>رسوم التوصيل</span><span>${delivery} ج</span></div>
        ` : ''}
        <div class="inv-grand"><span>الإجمالي</span><span>${grand} ج</span></div>
      </div>
      <div class="inv-foot">امسح الباركود لإعادة تتبع طلبك<br>شكراً لاختيارك طيّار ❤️</div>`;

    document.getElementById('invBg').classList.add('show');
  }, 350);
}

function closeInvoice() {
  document.getElementById('invBg').classList.remove('show');
}

function downloadPDF() {
  const order = _cachedOrder;
  if (!order) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'p', unit:'mm', format:[80,200] });
  const W = 80;
  let y = 10;

  let items = [];
  try { items = order.items ? JSON.parse(order.items) : []; } catch(e) {}
  const sub      = items.reduce((s,it) => s + it.price * it.qty, 0);
  const delivery = order.total && sub ? order.total - sub : 15;
  const grand    = order.total || sub + delivery;

  // Group by restaurant
  const groups = {};
  items.forEach(it => {
    const k = it.restName || order.restaurant || 'الطلب';
    if (!groups[k]) groups[k] = [];
    groups[k].push(it);
  });
  const restNames = Object.keys(groups);
  const multiRest = restNames.length > 1;

  const L = (txt, x, yy, size=9, bold=false, align='right') => {
    doc.setFontSize(size); doc.setFont('helvetica', bold?'bold':'normal');
    doc.text(String(txt), x, yy, {align});
  };
  const sep = yy => { doc.setDrawColor(220); doc.line(5,yy,W-5,yy); };

  // Header
  doc.setFillColor(255,107,53);
  doc.rect(0,0,W,18,'F');
  doc.setTextColor(255,255,255);
  L('Tayar Delivery', W/2, 8, 13, true, 'center');
  L('Invoice / Fatura', W/2, 14, 8, false, 'center');
  doc.setTextColor(30,30,30);
  y = 24;

  L(`Order #${order.order_number}`, W-5, y, 10, true, 'right'); y+=6;
  L(new Date().toLocaleDateString('en-GB'), W-5, y, 8, false, 'right'); y+=3;
  sep(y); y+=5;

  L('Customer:', 5, y, 8, true, 'left'); L(order.customer_name, W-5, y, 8, false, 'right'); y+=5;
  L('Phone:', 5, y, 8, true, 'left'); L(order.phone, W-5, y, 8, false, 'right'); y+=5;
  // Show all restaurants
  L(multiRest ? 'Restaurants:' : 'Restaurant:', 5, y, 8, true, 'left');
  L(restNames.join(', '), W-5, y, 7, false, 'right'); y+=5;
  sep(y); y+=5;

  if (items.length > 0) {
    L('ITEMS', W/2, y, 8, true, 'center'); y+=5;
    // Print grouped by restaurant
    restNames.forEach(rn => {
      if (multiRest) {
        doc.setTextColor(255,107,53);
        L('> ' + rn, 5, y, 7, true, 'left');
        doc.setTextColor(30,30,30); y+=4;
      }
      groups[rn].forEach(it => {
        L(it.name, 5, y, 8, false, 'left');
        L(`x${it.qty}  ${it.price*it.qty} EGP`, W-5, y, 8, false, 'right');
        y+=5;
      });
    });
    sep(y); y+=5;
  }

  if (sub > 0) {
    L('Subtotal:', 5, y, 8, false, 'left'); L(`${sub} EGP`, W-5, y, 8, false, 'right'); y+=5;
    L('Delivery:', 5, y, 8, false, 'left'); L(`${delivery} EGP`, W-5, y, 8, false, 'right'); y+=5;
    sep(y); y+=5;
  }

  doc.setFillColor(255,248,240);
  doc.rect(5,y-3,W-10,10,'F');
  doc.setTextColor(255,107,53);
  L('TOTAL:', 5, y+4, 11, true, 'left');
  L(`${grand} EGP`, W-5, y+4, 11, true, 'right');
  doc.setTextColor(30,30,30); y+=14;

  // QR code embed
  const tmp2 = document.createElement('div');
  tmp2.style.cssText='position:absolute;opacity:0;width:60px;height:60px';
  document.body.appendChild(tmp2);
  const trackUrl = `${location.origin}${location.pathname}?order=${order.order_number}`;
  new QRCode(tmp2,{text:trackUrl,width:60,height:60,correctLevel:QRCode.CorrectLevel.M});
  setTimeout(()=>{
    const cv = tmp2.querySelector('canvas');
    if(cv){ doc.addImage(cv.toDataURL(),'PNG',(W-30)/2,y,30,30); y+=33; }
    document.body.removeChild(tmp2);
    sep(y); y+=5;
    doc.setTextColor(150);
    L('Scan QR to track • Thank you!', W/2, y, 7, false, 'center');
    doc.save(`tayar-invoice-${order.order_number}.pdf`);
  },400);
}

if (!orderNumber) {
  document.getElementById('loadingOv').classList.add('gone');
  document.getElementById('notFound').classList.remove('gone');
  document.getElementById('nfSub').textContent = 'لم يتم تحديد رقم الطلب';
} else {
  poll();
  setInterval(poll,3000);
}
