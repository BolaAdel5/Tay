<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طيّار — لوحة الكابتن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --gold-dim: rgba(201,168,76,0.12);
    --bg: #0A0A0A;
    --surface: #111111;
    --surface2: #1A1A1A;
    --surface3: #222222;
    --border: rgba(201,168,76,0.18);
    --border-subtle: rgba(255,255,255,0.06);
    --text: #F0EDE8;
    --text-muted: #666;
    --pending-color: #E8A24C;
    --onway-color: #4C8FE8;
    --done-color: #4CAF7D;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  /* ── LOGIN SCREEN ── */
  .login-screen {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: opacity 0.4s, visibility 0.4s;
  }
  .login-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 80%, rgba(201,168,76,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 80% 20%, rgba(201,168,76,0.05) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }

  .login-box {
    width: 100%;
    max-width: 380px;
    text-align: center;
    animation: fadeUp 0.6s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .login-icon {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border-radius: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 34px;
    margin-bottom: 16px;
    box-shadow: 0 8px 32px rgba(201,168,76,0.35);
  }
  .login-title { font-size: 26px; font-weight: 900; color: var(--gold); letter-spacing: 1px; }
  .login-sub   { font-size: 13px; color: var(--text-muted); margin-top: 4px; margin-bottom: 32px; }

  .login-field {
    position: relative;
    margin-bottom: 16px;
  }
  .login-field input {
    width: 100%;
    padding: 15px 46px 15px 16px;
    background: #1A1A1A;
    border: 1.5px solid transparent;
    border-radius: 14px;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .login-field input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
  }
  .login-field .field-icon {
    position: absolute;
    right: 16px; top: 50%;
    transform: translateY(-50%);
    font-size: 16px; opacity: 0.45;
  }
  .login-field input::placeholder { color: #444; }

  .login-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border: none;
    border-radius: 14px;
    color: #0A0A0A;
    font-family: 'Cairo', sans-serif;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(201,168,76,0.4); }
  .login-btn:active { transform: translateY(0); }

  .login-error {
    font-size: 13px;
    color: #E05C5C;
    margin-top: 12px;
    font-weight: 600;
    min-height: 20px;
    transition: opacity 0.2s;
  }

  .login-hint {
    margin-top: 20px;
    font-size: 11px;
    color: #333;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .header-titles h1 {
    font-size: 18px;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 1px;
    line-height: 1;
  }

  .header-titles p {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(76,175,125,0.1);
    border: 1px solid rgba(76,175,125,0.3);
    color: var(--done-color);
    padding: 6px 14px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 700;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    background: var(--done-color);
    border-radius: 50%;
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.4; }
    50%       { opacity: 1; }
  }

  /* Stats bar */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 20px 20px 0;
    animation: fadeDown 0.5s ease both;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 16px 14px;
    text-align: center;
  }

  .stat-num {
    font-size: 26px;
    font-weight: 900;
    color: var(--gold);
    line-height: 1;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
    font-weight: 600;
  }

  /* Section header */
  .section-header {
    padding: 24px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Order card */
  .orders-list {
    padding: 0 20px 100px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .order-card {
    background: var(--surface);
    border: 1px solid var(--border-subtle);
    border-radius: 20px;
    overflow: hidden;
    transition: border-color 0.25s, transform 0.2s;
    animation: cardIn 0.4s ease both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .order-card:hover {
    border-color: var(--border);
    transform: translateY(-2px);
  }

  .order-card.active-delivery {
    border-color: rgba(76,143,232,0.4);
    box-shadow: 0 0 20px rgba(76,143,232,0.1);
  }

  .order-card.delivered {
    opacity: 0.55;
  }

  .card-top {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .order-info {}

  .order-num {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .customer-name {
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.2;
  }

  .customer-phone {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 3px;
    direction: ltr;
    text-align: right;
  }

  /* Status pill */
  .status-pill {
    padding: 5px 12px;
    border-radius: 50px;
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .pill-pending  { background: rgba(232,162,76,0.15); color: var(--pending-color); border: 1px solid rgba(232,162,76,0.3); }
  .pill-onway    { background: rgba(76,143,232,0.15); color: var(--onway-color);   border: 1px solid rgba(76,143,232,0.3); }
  .pill-done     { background: rgba(76,175,125,0.15); color: var(--done-color);     border: 1px solid rgba(76,175,125,0.3); }

  /* Action buttons */
  .card-actions {
    padding: 12px 18px 14px;
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    padding: 12px 8px;
    border: none;
    border-radius: 12px;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

  .btn-start {
    background: linear-gradient(135deg, #2563EB, #3B82F6);
    color: white;
    box-shadow: 0 4px 16px rgba(37,99,235,0.3);
  }

  .btn-start:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(37,99,235,0.45); }

  .btn-done {
    background: linear-gradient(135deg, #16A34A, #22C55E);
    color: white;
    box-shadow: 0 4px 16px rgba(22,163,74,0.3);
  }

  .btn-done:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(22,163,74,0.45); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .empty-state .empty-icon {
    font-size: 48px;
    margin-bottom: 14px;
    opacity: 0.5;
  }

  .empty-state p {
    font-size: 15px;
    font-weight: 600;
  }

  /* Loading skeleton */
  .skeleton {
    background: var(--surface2);
    border-radius: 20px;
    height: 140px;
    animation: shimmer 1.5s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { opacity: 0.6; }
    50%       { opacity: 1; }
  }

  /* Notification toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 22px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--done-color); color: var(--done-color); }
  .toast.info    { border-color: var(--onway-color); color: var(--onway-color); }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-icon">🛵</div>
    <div class="login-title">طيّار</div>
    <div class="login-sub">لوحة تحكم الكابتن — للمفوضين فقط</div>
    <div class="login-field">
      <input type="text"    id="loginUser" placeholder="اسم المستخدم" autocomplete="username">
      <span class="field-icon">👤</span>
    </div>
    <div class="login-field">
      <input type="password" id="loginPass" placeholder="كلمة المرور"  autocomplete="current-password"
             onkeydown="if(event.key==='Enter') doLogin()">
      <span class="field-icon">🔒</span>
    </div>
    <button class="login-btn" onclick="doLogin()">دخول</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-hint">💡 تجربة: captain / 1234</div>
  </div>
</div>

<div class="header">
  <div class="header-brand">
    <div class="header-icon">🛵</div>
    <div class="header-titles">
      <h1>طيّار</h1>
      <p>لوحة تحكم الكابتن</p>
    </div>
  </div>
  <div class="live-badge">
    <div class="live-dot"></div>
    مباشر
  </div>
</div>

<!-- Stats -->
<div class="stats-bar">
  <div class="stat-card">
    <div class="stat-num" id="statTotal">—</div>
    <div class="stat-label">إجمالي الطلبات</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="statPending" style="color: var(--pending-color)">—</div>
    <div class="stat-label">قيد الانتظار</div>
  </div>
  <div class="stat-card">
    <div class="stat-num" id="statDone" style="color: var(--done-color)">—</div>
    <div class="stat-label">مكتملة</div>
  </div>
</div>

<div class="section-header">
  <span class="section-title">الطلبات</span>
</div>

<div class="orders-list" id="orders">
  <div class="skeleton"></div>
  <div class="skeleton" style="opacity:0.5"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── LOGIN ──
const CAPTAIN_CREDS = { captain: '1234', admin: 'tayar2025' };

function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  if (CAPTAIN_CREDS[u] && CAPTAIN_CREDS[u] === p) {
    sessionStorage.setItem('tayar_auth', u);
    document.getElementById('loginScreen').classList.add('hidden');
    errEl.textContent = '';
    loadOrders();
  } else {
    errEl.textContent = '❌ اسم المستخدم أو كلمة المرور غير صحيحة';
  }
}

// Check session on load
window.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('tayar_auth')) {
    document.getElementById('loginScreen').classList.add('hidden');
    loadOrders();
  }
});

const SUPABASE_URL = 'https://ckxljrwcsjmdflxyxxoc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNreGxqcndjc2ptZGZseHl4eG9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NzcwODYsImV4cCI6MjA5NTQ1MzA4Nn0.tMouJB-NI12ev-TX9AX41CQzOCLQ4wR3xh6I2GTqxe0';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let watchId = null;
let activeDeliveryId = null;

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

function statusPill(status) {
  const map = {
    'Pending':    ['قيد الانتظار', 'pill-pending'],
    'On The Way': ['في الطريق',    'pill-onway'],
    'Delivered':  ['تم التسليم',   'pill-done'],
  };
  const [label, cls] = map[status] || [status, 'pill-pending'];
  return `<span class="status-pill ${cls}">${label}</span>`;
}

function cardClass(status) {
  if (status === 'On The Way') return 'order-card active-delivery';
  if (status === 'Delivered')  return 'order-card delivered';
  return 'order-card';
}

let _lastSnapshot = '';
async function loadOrders() {
  const { data, error } = await client
    .from('orders').select('*').order('id', { ascending: false });

  if (error || !data) return;
  
  // Skip re-render if nothing changed (avoids flicker every 3s)
  const snapshot = JSON.stringify(data.map(o => ({ id: o.id, status: o.status, driver_lat: o.driver_lat })));
  if (snapshot === _lastSnapshot) return;
  _lastSnapshot = snapshot;

  // Stats
  document.getElementById('statTotal').textContent   = data.length;
  document.getElementById('statPending').textContent = data.filter(o => o.status === 'Pending').length;
  document.getElementById('statDone').textContent    = data.filter(o => o.status === 'Delivered').length;

  const container = document.getElementById('orders');
  container.innerHTML = '';

  if (data.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <p>لا توجد طلبات حالياً</p>
      </div>`;
    return;
  }

  data.forEach((order, i) => {
    const startDisabled = (order.status === 'On The Way' || order.status === 'Delivered') ? 'disabled' : '';
    const doneDisabled  = order.status === 'Delivered' ? 'disabled' : '';

    const el = document.createElement('div');
    el.className = cardClass(order.status);
    el.style.animationDelay = (i * 0.06) + 's';
    el.innerHTML = `
      <div class="card-top">
        <div class="order-info">
          <div class="order-num">طلب #${order.order_number} ${order.restaurant ? '• ' + order.restaurant : ''}</div>
          <div class="customer-name">${order.customer_name}</div>
          <div class="customer-phone">${order.phone}</div>
          ${order.notes ? `<div style="font-size:11px;color:#888;margin-top:3px">📝 ${order.notes}</div>` : ''}
        </div>
        ${statusPill(order.status)}
      </div>
      <div class="card-actions">
        <button class="btn btn-start" onclick="startDelivery(${order.id})" ${startDisabled}>
          🛵 جاري التوصيل
        </button>
        <button class="btn btn-done" onclick="markDelivered(${order.id})" ${doneDisabled}>
          ✅ تم التسليم
        </button>
      </div>`;
    container.appendChild(el);
  });
}

window.startDelivery = async function(id) {
  if (activeDeliveryId && activeDeliveryId !== id) {
    showToast('⚠️ أنهِ التوصيل الحالي أولاً', 'info');
    return;
  }

  await client.from('orders').update({ status: 'On The Way' }).eq('id', id);
  activeDeliveryId = id;

  if (watchId) navigator.geolocation.clearWatch(watchId);

  watchId = navigator.geolocation.watchPosition(
    async (pos) => {
      await client.from('orders').update({
        driver_lat: pos.coords.latitude,
        driver_lng: pos.coords.longitude
      }).eq('id', id);
    },
    (err) => { console.warn(err); },
    { enableHighAccuracy: true }
  );

  showToast('🛵 بدأ التتبع المباشر', 'info');
  loadOrders();
};

window.markDelivered = async function(id) {
  if (!confirm('تأكيد: هل تم التسليم فعلاً؟')) return;
  if (watchId) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  activeDeliveryId = null;

  await client.from('orders').update({ status: 'Delivered' }).eq('id', id);
  showToast('✅ تم التسليم بنجاح!', 'success');
  loadOrders();
};

// loadOrders(); // handled by login check above
setInterval(() => {
  if (sessionStorage.getItem('tayar_auth') && !document.hidden) loadOrders();
}, 3000);
</script>
</body>
</html>
